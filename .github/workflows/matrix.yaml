name: My node basic matrix pipeline

on:
 push:
  branches: ["main"]
 pull_request:
  branches: ["main"] 
 workflow_dispatch:  

jobs:
  node:
   runs-on: [self-hosted, wsl-ubuntu]
   strategy:
     matrix:
      node-version: [24, 26]

   steps:
    - name: checkout code
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{matrix.node-version}}

    - name: intall packages
      run: npm install

    - name: Run the application
      run: |
        node server.js &
        sleep 5
        curl http://localhost:3000
        curl http://localhost:3000/health
        pkill -f "node server.js"
        
       


