name: My node basic pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: [self-hosted, wsl-ubuntu]
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buile docker image
        run: docker build -f Dockerfile -t dockerfile .

      - name: Tag and push docker image
        run:  |
          SHORT_SHA=${GITHUB_SHA::7}
          docker tag dockerfile ${{vars.DOCKERHUB_USERNAME }}/nodeapps::$SHORT_SHA
          docker push ${{vars.DOCKERHUB_USERNAME }}/nodeapps::$SHORT_SHA
             

  
         
