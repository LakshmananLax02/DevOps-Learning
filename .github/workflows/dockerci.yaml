name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:     
 
jobs:
  docker:
    runs-on: [self-hosted, wsl-ubuntu]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/nodeapplication:${GITHUB_SHA::7} \
            -t ${{ vars.DOCKERHUB_USERNAME }}/nodeapplication:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapplication:${GITHUB_SHA::7}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapplication:latest
